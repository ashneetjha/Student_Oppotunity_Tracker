<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - OpportunityHub</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="brand auth-brand" href="index.html"><span class="brand-mark">O</span> OpportunityHub</a>
  <div class="auth-heading"><h1>Welcome back</h1><p>Sign in to continue tracking your opportunities.</p></div>
  <form id="loginForm">
    <label>Email address</label><input type="email" id="email" placeholder="you@example.com" required>
    <label>Password</label><div class="password-wrap"><input type="password" id="password" placeholder="Enter password" required><button type="button" class="show-pass" onclick="togglePassword()">Show</button></div>
    <div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
    <button class="btn btn-primary full" type="submit">Sign In →</button>
  </form>
  <div class="divider"><span>or</span></div>
  <button class="btn btn-google full">Continue with Google</button>
  <p class="auth-bottom">Don't have an account? <a href="register.html">Create one</a></p>
  <p class="demo-note" style="margin-top:12px; line-height:1.5;">Demo Student: <b>student@example.com</b> / <b>Student@123</b><br>Demo Admin: <b>admin@example.com</b> / <b>Admin@123</b></p>
</div>
<script src="js/app.js"></script>
</body>
</html>
